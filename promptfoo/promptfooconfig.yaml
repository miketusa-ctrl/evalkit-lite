    value: output.length > 0
    metric: non_empty
  - type: llm-rubric
    value: '[tone_empathy] Score per rubrics/tone_empathy.yaml. Expected: Apologize sincerely, identify the bouncing email as cause, offer resend to new verified address or app wallet.'
    metric: tone_empathy
  - type: llm-rubric
    value: '[correctness] Score per rubrics/correctness.yaml. Expected: Apologize sincerely, identify the bouncing email as cause, offer resend to new verified address or app wallet.'
    metric: correctness
